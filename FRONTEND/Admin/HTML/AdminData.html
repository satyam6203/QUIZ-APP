<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Show Questions</title>
    <link rel="stylesheet" href="../CSS/admindata.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="wrapper">

    <div class="table-card">

        <h2>All Questions</h2>

        <div class="filter">
            <select id="topicSelect">
                <option value="">Select Topic</option>
                <option value="java">Java</option>
                <option value="python">Python</option>
                <option value="js">JavaScript</option>
                <option value="cpp">C++</option>
            </select>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Question</th>
                        <th>Options</th>
                        <th>Correct</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="tableBody">
                    <!-- Questions load here -->
                </tbody>
            </table>
        </div>

    </div>

</div>

<!-- 🔹 EDIT MODAL -->
<div class="edit-modal" id="editModal">

    <div class="edit-card">

        <h2>Edit Question</h2>

        <div class="form-group">
            <label>Question</label>
            <textarea id="editQuestion"></textarea>
        </div>

        <div class="form-group">
            <label>Option 1</label>
            <input type="text" id="editOpt1">
        </div>

        <div class="form-group">
            <label>Option 2</label>
            <input type="text" id="editOpt2">
        </div>

        <div class="form-group">
            <label>Option 3</label>
            <input type="text" id="editOpt3">
        </div>

        <div class="form-group">
            <label>Option 4</label>
            <input type="text" id="editOpt4">
        </div>

        <div class="form-group">
            <label>Correct Answer</label>
            <input type="text" id="editCorrect">
        </div>

        <div class="modal-actions">
            <button class="save-btn">Update Question</button>
            <button class="cancel-btn" onclick="closeEditModal()">Cancel</button>
        </div>

    </div>

</div>

<script src="../JS/Admin.js"></script>

</body>
</html>
