<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Question Form</title>
    <link rel="stylesheet" href="../CSS/Admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="wrapper">
    <form class="form" id="quizForm">
        <h2>Add Question</h2>

        <div class="select-box">
            <label>Select Topic</label>
            <select id="topic">
                <option value="">Select topic</option>
                <option value="java">Java</option>
                <option value="python">Python</option>
                <option value="js">JavaScript</option>
                <option value="cpp">C++</option>
            </select>
        </div>

        <textarea id="question" placeholder="Enter the question..."></textarea>
        <input type="text" id="opt1" placeholder="Option 1">
        <input type="text" id="opt2" placeholder="Option 2">
        <input type="text" id="opt3" placeholder="Option 3">
        <input type="text" id="opt4" placeholder="Option 4">
        <input type="text" id="correct" placeholder="Correct Ans">

        <div class="btn-group">
            <button type="submit" class="submit">Submit</button>
            <button type="reset" class="reset">Reset</button>
        </div>
    </form>
</div>

<script src="../JS/adminForm.js"></script>

</body>
</html>
